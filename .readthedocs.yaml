version: 2

# The API is generated statically (sphinx-autoapi) and the notebook outputs come
# from the committed execution cache (docs/build/.jupyter_cache): the build only
# needs Sphinx and its extensions, not GRSdriver nor its GDAL/EOReader stack.
# docs/environment.yml remains for local builds that execute the notebooks.

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
