# Conda environment to work from a clone of the repository (tutorials, visualization tools):
#   conda env create -f environment.yml && conda activate grsdriver
# All the dependencies come from pip (rasterio and geopandas bring their own GDAL).
name: grsdriver
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - -e .[cli,viz,tutorials,dev]
