# pyproject.toml
[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GRSdriver"
description = "Driver for L1C satellite images dedicated to GRS processor"
readme = "README.md"
authors = [{ name = "Tristan Harmel", email = "tristan.harmel@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
keywords = ["Sentinel-2", "Landsat-8", "Landsat-9", "driver", "EO satellite"]
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

#[tool.setuptools]
#include-package-data = true
#packages = ['GRSdriver']

[tool.setuptools.packages.find]
where = ["."]
include = ["GRSdriver*"]

[tool.setuptools.package-data]
"*" = ["*.nc", "*.txt", "*.csv", "*.dat","*.xlsx", "rsr/data/*"]

[tool.setuptools.exclude-package-data]
"*" = ["build", ".gitattributes"]

[project.scripts]
grs_driver = "GRSdriver.run:main"

#dynamic = ["dependencies"]
[tool.setuptools.dynamic]
# read statically from the source (GRSdriver is not imported)
version = { attr = "GRSdriver.__version__" }
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
# tests and release (see the contributing guide)
dev = ["pytest", "build", "twine"]
# grs_driver command line (RGB quicklook)
cli = ["matplotlib", "cartopy"]
# interactive visualization tools (GRSdriver.visual)
viz = ["matplotlib", "holoviews", "datashader", "bokeh", "colorcet", "panel"]
# to run the tutorial notebooks
tutorials = ["jupyterlab", "matplotlib", "cartopy", "requests"]

[project.urls]
Documentation = "https://grsdriver.readthedocs.io"
Homepage = "https://github.com/Tristanovsk/GRSdriver"
Changelog = "https://github.com/Tristanovsk/GRSdriver/blob/master/CHANGELOG.md"

